      content="Leonardo Velazquez is a multidisciplinary designer and artist working across graphic design, branding, illustration, photography and music."

    <!-- CHECK IF INTRO HAS ALREADY PLAYED -->
    <script>
      (function () {
        const introKey = "leo-intro-shown-v4";

        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        let played = false;

        try {
          played = sessionStorage.getItem(introKey) === "true";
        } catch (error) {}

        if (played || reducedMotion) {
          window.location.replace("work.html");
        } else {
          document.documentElement.classList.add("leo-intro-active");
        }
      })();
    </script>

    <!-- ==========================================
         ANIMATED SVG LOGO — CSS
         ========================================== -->

    <style>
      html.leo-intro-active,
      html.leo-intro-active body {
        overflow: hidden !important;
      }

      /* MAIN INTRO OVERLAY */

      .leo-intro {
        --leo-intro-bg: #f4f0e8;
        --leo-intro-ink: #d32525;
        --leo-intro-accent: #d32525;

        position: fixed;
        inset: 0;

        z-index: 2147483647;

        display: none;
        place-items: center;

        overflow: hidden;
        isolation: isolate;

        background: transparent;
        color: var(--leo-intro-ink);

        clip-path: inset(0 0 0 0);
        -webkit-clip-path: inset(0 0 0 0);
      }

      html.leo-intro-active .leo-intro {
        display: grid;
      }

      /* ==========================================
         WEBSITE REVEAL

         3.22s - Start reveal
         3.79s - Website visible
         ========================================== */

      .leo-intro__preview {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        border: 0;
        background: #f4f0e8;

        z-index: 2147483646;

        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }

      html.leo-intro-active .leo-intro__preview {
        visibility: visible;

        animation: leo-preview-reveal 570ms ease-in-out 3220ms both;
      }

      @keyframes leo-preview-reveal {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      /* BACKGROUND FADES AWAY
         WHILE THE LOGO REMAINS VISIBLE */

      .leo-intro::before {
        content: "";

        position: absolute;
        inset: 0;

        z-index: 0;

        pointer-events: none;

        background: var(--leo-intro-bg);
        opacity: 1;
      }

      .leo-intro.is-playing::before {
        animation: leo-reveal-paper 570ms ease-in-out 3220ms forwards;
      }

      @keyframes leo-reveal-paper {
        from {
          opacity: 1;
        }

        to {
          opacity: 0;
        }
      }

      /* ==========================================
         LOGO CONTAINER
         ========================================== */

      .leo-intro *,
      .leo-intro *::before,
      .leo-intro *::after {
        box-sizing: border-box;
      }

      .leo-intro__scene {
        display: grid;
        place-items: center;

        position: relative;
        z-index: 1;

        width: min(53vw, 290px);
        padding-bottom: 42px;

        will-change: transform, opacity;
      }

      .leo-intro__svg {
        width: 100%;
        height: auto;

        display: block;
        overflow: visible;
      }

      /* ==========================================
         SVG DRAWING MASKS
         ========================================== */

      .leo-trace,
      .leo-trace--eye {
        fill: none;
        stroke: white;

        stroke-linecap: round;
        stroke-linejoin: round;

        stroke-dasharray: 100;
        stroke-dashoffset: 100;
      }

      .leo-trace--contour {
        stroke-width: 38;
      }

      .leo-trace--snout {
        stroke-width: 34;
        visibility: hidden;
      }

      .leo-trace--eye {
        stroke-width: 23;
        visibility: hidden;

        transform-origin: 69.56px 90.49px;
        transform: rotate(-115deg);
      }

      /* EYE MOVEMENT */

      .leo-intro__eye {
        transform-box: view-box;
        transform-origin: 69.56px 90.49px;

        will-change: transform;
      }

      /* ==========================================
         LOGO CAPTION
         ========================================== */

      .leo-intro__caption {
        position: absolute;

        top: calc(100% - 18px);
        left: 50%;

        width: max-content;
        max-width: 96vw;

        transform: translate(-50%, 8px);

        font:
          700 10px/1.4 system-ui,
          -apple-system,
          sans-serif;

        letter-spacing: 0.2em;
        text-align: center;

        opacity: 0;
      }

      .leo-intro__caption span {
        color: var(--leo-intro-accent);
        padding: 0 0.3em;
      }

      /* ==========================================
         SKIP BUTTON
         ========================================== */

      .leo-intro__skip {
        position: absolute;

        right: clamp(20px, 3vw, 56px);
        bottom: max(26px, env(safe-area-inset-bottom));

        z-index: 2;

        border: 0;
        border-bottom: 1px solid currentColor;

        padding: 12px 1px 8px;

        background: transparent;
        color: inherit;

        font:
          700 11px/1.3 system-ui,
          -apple-system,
          sans-serif;

        letter-spacing: 0.11em;
        cursor: pointer;

        opacity: 0.7;

        transition: opacity 250ms ease;
      }

      .leo-intro__skip:hover {
        opacity: 1;
      }

      .leo-intro__skip:focus-visible {
        outline: 2px solid var(--leo-intro-accent);
        outline-offset: 5px;
      }

      /* ==========================================
         EXACT ANIMATION TIMELINE

         0.00 - 3.10s  DRAWING
         3.22 - 3.79s  WEBSITE REVEAL
         4.00 - 4.57s  EYE BLINK
         4.75s          FINAL EXIT
         ========================================== */

      /* DRAW FACE */

      .leo-intro.is-playing .leo-trace--contour {
        animation: leo-draw 3020ms cubic-bezier(0.42, 0.02, 0.51, 0.98) both;
      }

      /* DRAW EYE */

      .leo-intro.is-playing .leo-trace--eye {
        animation:
          leo-draw 700ms cubic-bezier(0.34, 0.05, 0.55, 0.98) 750ms both,
          leo-appear 1ms steps(1, end) 750ms forwards;
      }

      /* BLINK AT EXACTLY 4 SECONDS */

      .leo-intro.is-playing .leo-intro__eye {
        animation: leo-blink 570ms linear 4000ms both;
      }

      /* FINISH NOSE AND MUZZLE */

      .leo-intro.is-playing .leo-trace--snout {
        animation:
          leo-draw 770ms cubic-bezier(0.34, 0.04, 0.57, 0.96) 2330ms both,
          leo-appear 1ms steps(1, end) 2330ms forwards;
      }

      /* REVEAL CAPTION */

      /* EXIT AFTER BLINK */

      .leo-intro.is-exiting {
        animation: leo-curtain 940ms cubic-bezier(0.65, 0, 0.22, 1) forwards;
      }

      .leo-intro.is-exiting .leo-intro__scene {
        animation: leo-gently-away 890ms cubic-bezier(0.25, 0, 0.45, 1) both;
      }

      /* ==========================================
         KEYFRAMES
         ========================================== */

      @keyframes leo-draw {
        from {
          stroke-dashoffset: 100;
        }

        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes leo-appear {
        from,
        to {
          visibility: visible;
        }
      }

      /* NATURAL EYE BLINK */

      @keyframes leo-blink {
        0% {
          transform: scaleY(1);
        }

        15% {
          transform: scaleY(1);
          animation-timing-function: cubic-bezier(0.64, 0, 1, 0.58);
        }

        34% {
          transform: scaleY(0.055);
        }

        46% {
          transform: scaleY(0.055);
          animation-timing-function: cubic-bezier(0.12, 0.65, 0.26, 1);
        }

        83% {
          transform: scaleY(1.025);
        }

        100% {
          transform: scaleY(1);
        }
      }

      @keyframes leo-caption {
        to {
          opacity: 0.8;
          transform: translate(-50%, 0);
        }
      }

      @keyframes leo-curtain {
        from {
          clip-path: inset(0 0 0 0);
          -webkit-clip-path: inset(0 0 0 0);
        }

        to {
          clip-path: inset(0 0 100% 0);
          -webkit-clip-path: inset(0 0 100% 0);
        }
      }

      @keyframes leo-gently-away {
        from {
          transform: translateY(0) scale(1);
          opacity: 1;
        }

        to {
          transform: translateY(-10px) scale(1.025);
          opacity: 0.4;
        }
      }

      /* ==========================================
         MOBILE RESPONSIVENESS
         ========================================== */

      @media (max-width: 600px) {
        .leo-intro__scene {
          width: min(62vw, 245px);
        }

        .leo-intro__caption {
          font-size: 8px;
          letter-spacing: 0.12em;
        }
      }

      /* ACCESSIBILITY */

      @media (prefers-reduced-motion: reduce) {
        .leo-intro,
        .leo-intro * {
          animation: none !important;
          transition: none !important;
        }
      }

      /* HIDE ORIGINAL HOLDING PAGE DURING INTRO */

      html.leo-intro-active body.holding-page {
        background: #f4f0e8 !important;
      }

      html.leo-intro-active .blob-container,
      html.leo-intro-active .noise-overlay,
      html.leo-intro-active .holding-page-wrapper {
        visibility: hidden !important;
      }
    </style>

    <!-- ==========================================
         LOGO INTRO JAVASCRIPT
         ========================================== -->

    <script>
      (() => {
        "use strict";

        const KEY = "leo-intro-shown-v4";
        const DESTINATION = "work.html";

        const root = document.documentElement;
        const intro = document.getElementById("leo-intro");

        if (!intro) {
          window.location.replace(DESTINATION);
          return;
        }

        let saved = false;

        try {
          saved = sessionStorage.getItem(KEY) === "true";
        } catch (_) {}

        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        if (saved || reduceMotion) {
          window.location.replace(DESTINATION);
          return;
        }

        let exiting = false;

        let finishTimer;
        let fallbackTimer;
        let removeTimer;

        const skip = intro.querySelector(".leo-intro__skip");

        /* OPEN PORTFOLIO */

        function removeIntro() {
          clearTimeout(removeTimer);

          document.removeEventListener("keydown", handleKey);

          window.location.replace(DESTINATION);
        }

        /* FINISH INTRO */

        function finishIntro() {
          if (exiting) return;

          exiting = true;

          clearTimeout(finishTimer);
          clearTimeout(fallbackTimer);

          try {
            sessionStorage.setItem(KEY, "true");
          } catch (_) {}

          intro.classList.add("is-exiting");

          const onExitAnimationEnd = (event) => {
            if (
              event.target !== intro ||
              event.animationName !== "leo-curtain"
            ) {
              return;
            }

            intro.removeEventListener("animationend", onExitAnimationEnd);

            removeIntro();
          };

          intro.addEventListener("animationend", onExitAnimationEnd);

          removeTimer = setTimeout(removeIntro, 1150);
        }

        /* ESCAPE KEY */

        function handleKey(event) {
          if (event.key === "Escape") {
            finishIntro();
          }
        }

        skip?.addEventListener("click", finishIntro);

        document.addEventListener("keydown", handleKey);

        root.classList.add("leo-intro-active");

        /* WAIT FOR THE BLINK TO FINISH */

        const eye = intro.querySelector(".leo-intro__eye");

        eye?.addEventListener("animationend", (event) => {
          if (event.animationName === "leo-blink") {
            finishTimer = setTimeout(finishIntro, 180);
          }
        });

        /* START ANIMATION */

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            intro.classList.add("is-playing");

            // Fallback if animation events are blocked
            fallbackTimer = setTimeout(finishIntro, 6000);
          });
        });
      })();
    </script>
